      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('idea_adda_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#090B10] dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">

    <script type="module" src="/src/main.tsx"></script>
  </body>
